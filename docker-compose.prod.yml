services:
  faq-assistant:
    build: .
    container_name: ai-faq-assistant
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./knowledge:/app/knowledge:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: simas-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - faq-assistant
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
