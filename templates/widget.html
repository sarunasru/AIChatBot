<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtualus DI asistentas Simas</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/widget.css">
</head>
<body class="widget-body">
    <div id="launcher-wrap" class="launcher-wrap">
        <button id="dismiss-btn" class="dismiss-btn" type="button" aria-label="Paslėpti asistento mygtuką">&#10005;</button>
        <button id="launcher-btn" class="launcher-btn" type="button" aria-label="Atidaryti pokalbį su asistentu">
            <img src="/static/Simas.png" alt="Virtualus asistentas Simas">
            <span class="launcher-label">Bibliotekininkas Simas</span>
        </button>
    </div>

    <div id="widget-panel" class="widget-panel hidden">
        <div class="chat-app">
            <header class="chat-header">
                <div class="chat-header-title">
                    <span class="chat-header-dot"></span>
                    <h1>DI asistentas Simas</h1>
                </div>
                <div class="chat-header-actions">
                    <button id="clear-btn" class="clear-btn" type="button">Išvalyti</button>
                    <button id="minimize-btn" class="minimize-btn" type="button" aria-label="Uždaryti pokalbį">
                        &#10005;
                    </button>
                </div>
            </header>

            <main id="messages" class="messages" aria-live="polite">
                <div class="message assistant">
                    <div class="bubble"> Sveiki! Klauskite manęs bet ko apie mūsų biblioteką ir jos paslaugas – mielai padėsiu.</div>
                </div>
            </main>

            <div id="loading-indicator" class="loading-indicator hidden">
                <span></span><span></span><span></span>
            </div>

            <footer class="chat-input-area">
                <textarea
                    id="message-input"
                    class="message-input"
                    placeholder="Įveskite klausimą... (Enter siųsti, Shift+Enter nauja eilutė)"
                    rows="1"
                ></textarea>
                <button id="send-btn" class="send-btn" type="button" aria-label="Siųsti žinutę">
                    Siųsti
                </button>
            </footer>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script src="/static/widget-toggle.js"></script>
</body>
</html>
